<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A 3x3 pixel "H"; its crossbar is the accent square that travels the stack map. -->
  <style>.bg{fill:#1c1a17}.ink{fill:#f5f1ea}.acc{fill:#6cb8e6}@media (prefers-color-scheme: dark){.bg{fill:#f5f1ea}.ink{fill:#1c1a17}.acc{fill:#1d6a9e}}</style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <g class="ink" shape-rendering="crispEdges"><rect x="6" y="6" width="6" height="6"/><rect x="6" y="13" width="6" height="6"/><rect x="6" y="20" width="6" height="6"/><rect x="20" y="6" width="6" height="6"/><rect x="20" y="13" width="6" height="6"/><rect x="20" y="20" width="6" height="6"/></g>
  <rect class="acc" x="13" y="13" width="6" height="6" shape-rendering="crispEdges"/>
</svg>
